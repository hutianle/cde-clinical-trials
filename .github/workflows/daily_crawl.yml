name: Scheduled CDE New Drug Ingestion & Deploy

on:
  schedule:
    # Runs every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    # Spaced out evenly (6 times a day x ~8-10 trials = ~50 new drug trials/day)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run CDE Incremental & Historical Backfill Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_TARGET: 10 # 10 new drug trials per batch run (~50/day across 5 runs)
        run: |
          python crawler/scraper.py

      - name: Commit and push updated database & crawler state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-ingest CDE new drug trials & update cursor [skip ci]"
            git push origin HEAD
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
