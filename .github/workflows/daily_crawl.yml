name: Scheduled CDE New Drug Ingestion & Deploy

on:
  # NOTE 2026-11-18: native schedule REMOVED — GitHub's scheduler never fired reliably
  # (0 runs Nov 17; 1 late run Nov 18 06:55; 07:17 and 08:17 slots skipped).
  # Hourly runs are now driven externally via workflow_dispatch (Muse hourly trigger).
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run CDE Incremental & Historical Backfill Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_TARGET: 20 # 20 new drug trials per batch run (24 runs/day x 20 = ~480/day, ~6,000 in ~13 days)
        run: |
          python crawler/scraper.py

      - name: Commit and push updated database & crawler state to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/data/
          if git diff --staged --quiet; then
            echo "No changes to commit to main."
          else
            git commit -m "Auto-ingest CDE new drug trials & update cursor [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
